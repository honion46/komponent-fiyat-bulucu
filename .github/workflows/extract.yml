name: Extract V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V2
        run: |
          set -e

          ZIP="komponent-fiyat-bulucu-v2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP bulunamadı: $ZIP"
            exit 1
          fi

          mkdir -p /tmp/v2
          unzip -o "$ZIP" -d /tmp/v2

          ROOT="/tmp/v2/komponent-fiyat-bulucu-v2"

          if [ ! -d "$ROOT" ]; then
            ROOT="/tmp/v2"
          fi

          cp -r "$ROOT"/. .

          rm -f "$ZIP"

          echo "Dosyalar çıkarıldı:"
          find . -maxdepth 4 -type f | sort

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git diff --cached --quiet && exit 0

          git commit -m "Extract V2 price finder"
          git push
